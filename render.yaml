# Despliegue de JobFlow AI en Render.com (plan gratuito)
# Al conectar este repositorio, Render crea el servicio automáticamente.
services:
  - type: web
    name: jobflow-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn jobflow.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: LLM_PROVIDER
        value: "none"
      - key: JOBFLOW_CONFIRM
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
